version: '3.8'

services:
  # Note: MongoDB is not included. Use MongoDB Atlas or configure MONGODB_URI to point to your MongoDB instance.
  # Uncomment the db service below if you want to run MongoDB locally instead of using Atlas.
  
  # db:
  #   image: mongo:7.0
  #   container_name: aibigo-mongodb
  #   restart: unless-stopped
  #   ports:
  #     - "27017:27017"
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
  #     MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password}
  #     MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-aibigo}
  #   volumes:
  #     - mongodb_data:/data/db
  #     - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
  #   networks:
  #     - aibigo-network
  #   healthcheck:
  #     test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aibigo-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      MONGODB_URI: ${MONGODB_URI}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    # depends_on:
    #   db:
    #     condition: service_healthy
    networks:
      - aibigo-network
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
    command: npm run dev

# volumes:
#   mongodb_data:
#     driver: local

networks:
  aibigo-network:
    driver: bridge
